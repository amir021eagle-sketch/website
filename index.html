<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درخواست دعوت نامه</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/script.js">
</head>
<body>

    <div class="container">

        <h2>🎟 درخواست دعوت‌نامه</h2>
        <p>یکی از گزینه‌ها را انتخاب کنید</p>

        <div class="options">

            <button class="option locked">  گزینه 1</button>

            <button class="option locked">گزینه 2</button>

            <button class="option locked">گزینه 3  </button>

            <button class="option active"> تو کونی  </button>

        </div>

        <div class="buttons">
            <button id="submit">ارسال درخواست</button>
            <button id="exit">خروج</button>
        </div>

        <div id="message"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
